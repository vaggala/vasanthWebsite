<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résumé | Vasanth Aggala</title>
    <meta name="description" content="Résumé of Vasanth Aggala, Computer Engineering at Georgia Tech.">
    <meta name="color-scheme" content="light dark">
    <script>
        // Apply a saved theme before the page draws, so it never flashes the wrong colors.
        try {
            const saved = localStorage.getItem("theme");
            if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
        } catch (e) {}
    </script>
    <link rel="icon" type="image/webp" href="assets/webLogo.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="wrap header-inner">
            <a class="brand" href="/">Vasanth Aggala</a>
            <nav class="nav" aria-label="Sections">
                <a href="/#about">About</a>
                <a href="/#experience">Experience</a>
                <a href="/#school">School</a>
                <a href="/#projects">Projects</a>
                <a href="/#contact">Contact</a>
            </nav>
            <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch light / dark">
                <i class="fa-solid fa-moon icon-moon" aria-hidden="true"></i>
                <i class="fa-solid fa-sun icon-sun" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main class="wrap section">
        <div class="resume-head">
            <h1>Résumé</h1>
            <div class="links">
                <a href="/"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back</a>
                <a class="primary" href="assets/vasanth_aggala_resume.pdf" download><i class="fa-solid fa-download" aria-hidden="true"></i> Download PDF</a>
            </div>
        </div>
        <iframe class="resume-frame" src="assets/vasanth_aggala_resume.pdf" title="Vasanth Aggala résumé (PDF)"></iframe>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
